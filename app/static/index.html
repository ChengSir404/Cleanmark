<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 水印处理工具</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="app-frame">
        <aside class="brand-panel" aria-label="工具状态">
          <div>
            <p class="eyebrow">CPU Image Lab</p>
            <h1>AI 水印处理工具</h1>
          </div>

          <div class="preview" id="preview">
            <div class="preview-empty">
              <span class="preview-mark"></span>
              <strong>等待图片</strong>
            </div>
            <img id="preview-image" alt="待处理图片预览" />
          </div>

          <div class="meta-grid">
            <span>Visible</span>
            <span>Metadata</span>
            <span>Erase</span>
          </div>
        </aside>

        <form id="tool-form" class="control-panel">
          <div class="topbar">
            <div>
              <p class="section-kicker">处理任务</p>
              <h2 id="mode-title">已知可见水印</h2>
            </div>
            <span class="status-pill" id="status-pill">Ready</span>
          </div>

          <label class="upload" id="upload-zone">
            <input id="file" name="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff" required />
            <span class="upload-icon" aria-hidden="true"></span>
            <span class="upload-copy">
              <strong>选择图片</strong>
              <em id="file-name">PNG、JPG、WEBP、BMP、TIFF</em>
            </span>
          </label>

          <fieldset class="mode-grid">
            <legend>处理方式</legend>
            <label class="mode-card">
              <input type="radio" name="operation" value="visible" checked />
              <span class="mode-body">
                <strong>可见水印</strong>
                <small>Gemini / 豆包 / 即梦</small>
              </span>
            </label>
            <label class="mode-card">
              <input type="radio" name="operation" value="metadata" />
              <span class="mode-body">
                <strong>元数据</strong>
                <small>C2PA / EXIF / XMP</small>
              </span>
            </label>
            <label class="mode-card">
              <input type="radio" name="operation" value="erase" />
              <span class="mode-body">
                <strong>区域擦除</strong>
                <small>x,y,w,h</small>
              </span>
            </label>
          </fieldset>

          <label class="field" id="mark-field">
            <span>水印类型</span>
            <select name="mark">
              <option value="auto">自动识别</option>
              <option value="gemini">Gemini / Nano Banana</option>
              <option value="doubao">豆包</option>
              <option value="jimeng">即梦</option>
              <option value="samsung">Samsung Galaxy AI</option>
            </select>
          </label>

          <label class="field hidden" id="regions-field">
            <span>区域坐标</span>
            <textarea name="regions" rows="4" placeholder="1640,1930,400,100"></textarea>
          </label>

          <label class="terms">
            <input type="checkbox" name="accept_terms" value="true" required />
            <span>我确认仅处理自己有权处理的内容，并自行遵守适用法律与平台规则。</span>
          </label>

          <div class="action-row">
            <button id="submit" type="submit">
              <span class="button-icon" aria-hidden="true"></span>
              <span>开始处理</span>
            </button>
          </div>

          <section id="result" class="result" aria-live="polite"></section>
        </form>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>

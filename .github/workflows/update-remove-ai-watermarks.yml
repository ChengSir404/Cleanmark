name: Update remove-ai-watermarks

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/update-remove-ai-watermarks.yml"
      - "scripts/update_remove_ai_watermarks.py"
      - "scripts/smoke_test_remove_ai_watermarks.py"
      - "tests/test_update_remove_ai_watermarks.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"

permissions:
  contents: write
  packages: write

concurrency:
  group: dependency-update-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Configure git author
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record original commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check, install, test and update dependency
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/update_remove_ai_watermarks.py --skip-commit
          else
            python scripts/update_remove_ai_watermarks.py
          fi

      - name: Check whether dependency changed
        if: github.event_name != 'pull_request'
        id: changes
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ steps.before.outputs.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push validated dependency update
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        run: git push origin HEAD:main

      # Pushes using GITHUB_TOKEN do not trigger the separate publish workflow,
      # so publish directly here after the validated dependency update.
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push updated image
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

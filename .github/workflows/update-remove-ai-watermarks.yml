name: Update remove-ai-watermarks

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
  # When the updater itself changes, validate and publish any new upstream release.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-remove-ai-watermarks.yml"
  pull_request:
    paths:
      - ".github/workflows/update-remove-ai-watermarks.yml"
      - "scripts/update_remove_ai_watermarks.py"
      - "scripts/smoke_test_remove_ai_watermarks.py"
      - "tests/test_update_remove_ai_watermarks.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "uv.lock"

permissions:
  contents: write
  actions: write

concurrency:
  group: dependency-update-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Configure git author
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record original commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check, install, test and update dependency
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/update_remove_ai_watermarks.py --skip-commit
          else
            python scripts/update_remove_ai_watermarks.py
          fi

      - name: Check whether dependency changed
        if: github.event_name != 'pull_request'
        id: changes
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ steps.before.outputs.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push validated dependency update
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        run: git push origin HEAD:main

      # workflow_dispatch is allowed to trigger workflows with GITHUB_TOKEN.
      # Use one image publisher to avoid overlapping pushes racing on :latest.
      - name: Trigger Docker publication
        if: github.event_name != 'pull_request' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-image.yml --ref main

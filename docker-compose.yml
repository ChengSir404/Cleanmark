services:
  web:
    container_name: cleanmark
    image: ${CLEANMARK_IMAGE:-ghcr.io/chengsir404/cleanmark:latest}
    restart: unless-stopped
    environment:
      JOB_ROOT: /data/jobs
      MAX_FILES: ${MAX_FILES:-10}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_TOTAL_UPLOAD_MB: ${MAX_TOTAL_UPLOAD_MB:-100}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-50000000}
      PROCESS_TIMEOUT_SECONDS: ${PROCESS_TIMEOUT_SECONDS:-120}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    volumes:
      - jobs:/data/jobs
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles:
      - tunnel

volumes:
  jobs:

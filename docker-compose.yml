services:
  web:
    build: .
    restart: unless-stopped
    environment:
      JOB_ROOT: /data/jobs
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      PROCESS_TIMEOUT_SECONDS: ${PROCESS_TIMEOUT_SECONDS:-120}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    volumes:
      - jobs:/data/jobs
    expose:
      - "8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles:
      - tunnel

volumes:
  jobs:
